<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Quiz Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; text-align: center; font-family: sans-serif; padding-top: 15px; }
        #videoContainer { position: relative; width: 100%; max-width: 500px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
        video { display: none; } /* Run the raw stream invisibly in the backend wrapper */
        canvas { width: 100%; height: auto; display: block; }
        .house-banner { font-size: 1.8rem; font-weight: bold; padding: 15px; border-radius: 8px; margin: 15px auto; max-width: 500px; display: none; }
        .Gryffindor { background-color: #7F0909; }
        .Ravenclaw { background-color: #0E1A40; }
        .Hufflepuff { background-color: #ECB939; color: black; }
        .Slytherin { background-color: #1A472A; }
        #status { font-weight: bold; color: #ecb939; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container px-3">
    <h3 class="my-3">⚡ Live Sorting Hat Lens</h3>
    <div id="status">⏳ Waking up Video Vision Engine...</div>

    <div id="videoContainer">
        <video id="videoFeed" autoplay playsinline></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="house-banner" id="winnerBanner"></div>
    
    <div class="card bg-dark text-start p-3 my-3 mx-auto" id="detailsCard" style="max-width: 500px; display: none; border: 1px solid #333;">
        <h6>Live Stream Diagnostics:</h6>
        <div id="breakdown" class="small font-monospace text-muted"></div>
    </div>
</div>

<script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript" onload="initLiveScanner();"></script>

<script>
const video = document.getElementById('videoFeed');
const canvas = document.getElementById('canvasOutput');
const ctx = canvas.getContext('2d');
let src, gray, thresh, contours, hierarchy;
let streamActive = false;

async function initLiveScanner() {
    document.getElementById('status').innerText = "🎥 Requesting live video permissions...";
    
    try {
        // Request the rear-facing camera explicitly for mobile devices
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        });
        video.srcObject = stream;
    } catch (err) {
        // Fallback to default webcam if no rear environment camera is present (like on a laptop)
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
    }

    video.play();
    video.addEventListener('canplay', () => {
        if (!streamActive) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Allocate permanent WebAssembly memory space blocks for processing frames
            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            gray = new cv.Mat();
            thresh = new cv.Mat();
            contours = new cv.MatVector();
            hierarchy = new cv.Mat();
            
            streamActive = true;
            document.getElementById('status').innerText = "🔮 Point camera squarely at the quiz sheet";
            requestAnimationFrame(processFrame);
        }
    });
}

function processFrame() {
    if (!streamActive) return;

    // 1. Capture the current frame from video onto the viewport canvas context
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    src.data.set(imageData.data);

    // 2. Clear out noise and isolate edge geometries
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
    cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

    // 3. Find structural contour loops
    cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let boxes = [];
    for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let rect = cv.boundingRect(cnt);
        let aspectRatio = rect.width / rect.height;

        // Filter out shapes that do not share your quiz box dimensional profile
        if (rect.width > 20 && rect.height > 30 && aspectRatio > 0.5 && aspectRatio < 0.95) {
            let roi = thresh.roi(rect);
            let totalPixels = cv.countNonZero(roi);
            let fillRatio = totalPixels / (rect.width * rect.height);
            roi.delete();

            boxes.push({ rect: rect, fillRatio: fillRatio });
        }
    }

    // Process calculations if we see a valid layout distribution block
    if (boxes.length >= 5) {
        // Sort boxes structurally Top-to-Bottom
        boxes.sort((a, b) => a.rect.y - b.rect.y);
        
        let rows = [];
        let currentRow = [boxes[0]];
        let yThreshold = 20;

        for (let i = 1; i < boxes.length; i++) {
            if (Math.abs(boxes[i].rect.y - currentRow[0].rect.y) < yThreshold) {
                currentRow.push(boxes[i]);
            } else {
                rows.push(currentRow);
                currentRow = [boxes[i]];
            }
        }
        rows.push(currentRow);

        // Filter and isolate standard 4-choice response structures
        rows = rows.filter(r => r.length >= 2 && r.length <= 4);
        rows.forEach(r => r.sort((a, b) => a.rect.x - b.rect.x));
        rows = rows.slice(-5); // Track the bottom-most complete blocks

        if (rows.length === 5) {
            const houses = ["Gryffindor", "Ravenclaw", "Hufflepuff", "Slytherin"];
            let tally = { Gryffindor: 0, Ravenclaw: 0, Hufflepuff: 0, Slytherin: 0 };
            let diagnosisText = "";

            rows.forEach((row, rowIndex) => {
                let maxFill = 0;
                let chosenIndex = -1;

                row.forEach((box, colIndex) => {
                    // Render neon target bounding marks back to the visual layout canvas interface
                    ctx.strokeStyle = box.fillRatio > 0.38 ? '#FF0000' : '#00FF00';
                    ctx.lineWidth = box.fillRatio > 0.38 ? 4 : 2;
                    ctx.strokeRect(box.rect.x, box.rect.y, box.rect.width, box.rect.height);

                    if (box.fillRatio > 0.38 && box.fillRatio > maxFill) {
                        maxFill = box.fillRatio;
                        chosenIndex = colIndex;
                    }
                });

                if (chosenIndex !== -1 && row.length === 4) {
                    tally[houses[chosenIndex]]++;
                    diagnosisText += `Q${rowIndex+1}: Found choice position ${chosenIndex}<br>`;
                }
            });

            // If answers are actively resolving, compute real-time score overlays
            let totalScore = Object.values(tally).reduce((a, b) => a + b, 0);
            if (totalScore > 0) {
                let winner = Object.keys(tally).reduce((a, b) => tally[a] >= tally[b] ? a : b);
                
                let banner = document.getElementById('winnerBanner');
                banner.className = `house-banner ${winner}`;
                banner.innerHTML = `LIVE SORTING: ${winner.toUpperCase()}!`;
                banner.style.display = 'block';

                document.getElementById('breakdown').innerHTML = diagnosisText;
                document.getElementById('detailsCard').style.display = 'block';
            }
        }
    }

    // Keep the calculation loop running on every single frame refresh natively
    requestAnimationFrame(processFrame);
}
</script>
</body>
</html>
